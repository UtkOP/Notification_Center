function timeAgo(iso){
  const d=new Date(iso);const now=new Date("2026-09-08T11:00:00");
  const mins=Math.floor((now-d)/60000);
  if(mins<60)return `${mins}m ago`;
  const hrs=Math.floor(mins/60);
  if(hrs<24)return `${hrs}h ago`;
  const days=Math.floor(hrs/24);
  return days===1?"Yesterday":`${days}d ago`;
}

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 24px",marginBottom:16}}>
            <div>
              <div style={{fontSize:11,color:C.t3,marginBottom:3}}>Request ID</div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:12.5,color:C.text,background:C.grayL,padding:"2px 8px",borderRadius:5}}>{d.requestId}</span>
                <span style={{display:"inline-flex",alignItems:"center",padding:"2px 8px",borderRadius:4,fontSize:12,fontWeight:500,background:s.bg,color:s.c,border:`1px solid ${s.b}`}}>{d.status}</span>
              </div>
            </div>
            <div>
              <div style={{fontSize:11,color:C.t3,marginBottom:3}}>Created</div>
              <div style={{fontSize:12.5,color:C.text}}>{d.created}</div>
            </div>
            <div>
              <div style={{fontSize:11,color:C.t3,marginBottom:3}}>Target ID</div>
              <span style={{fontSize:12.5,color:C.text,background:C.grayL,padding:"2px 8px",borderRadius:5}}>{d.target}</span>
            </div>
            <div>
              <div style={{fontSize:11,color:C.t3,marginBottom:3}}>Updated</div>
              <div style={{fontSize:12.5,color:C.text}}>{d.updated}</div>
            </div>
            <div>
              <div style={{fontSize:11,color:C.t3,marginBottom:3}}>Requested By</div>
              <div style={{fontSize:12.5,color:C.text}}>{d.requestedBy}</div>
            </div>
            <div>
              <div style={{fontSize:11,color:C.t3,marginBottom:3}}>Acted By</div>
              <div style={{fontSize:12.5,color:C.text}}>{d.actedBy}</div>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,paddingTop:14,borderTop:`1px solid ${C.border}`,marginBottom:16}}>
            <div>
              <div style={{fontSize:11,color:C.t3,marginBottom:4}}>Domain</div>
              <div style={{fontSize:12.5,fontWeight:600,color:C.text}}>{d.domain}</div>
            </div>
            <div>
              <div style={{fontSize:11,color:C.t3,marginBottom:4}}>Action</div>
              <div style={{fontSize:12.5,fontWeight:600,color:C.text}}>{d.action}</div>
            </div>
            <div>
              <div style={{fontSize:11,color:C.t3,marginBottom:4}}>Checker Progress</div>
              <div style={{fontSize:12.5,fontWeight:600,color:C.text}}>{d.checkerProgress}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:6,marginBottom:16}}>
            {[["maker","Maker Submission"],["remarks","Remarks"]].map(([k,l])=>(
              <button key={k} onClick={()=>setTab(k)} style={{padding:"6px 14px",borderRadius:7,border:`1px solid ${tab===k?C.text:C.grayB}`,background:C.bg,color:C.text,fontSize:12.5,fontWeight:500,cursor:"pointer"}}>{l}</button>
            ))}
          </div>
          {tab==="maker"&&<>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:18}}>
              <div>
                <div style={{fontSize:12.5,fontWeight:600,color:C.text,marginBottom:4}}>Reason</div>
                <div style={{fontSize:12.5,color:C.t2}}>{d.reason}</div>
              </div>
              <div>
                <div style={{fontSize:12.5,fontWeight:600,color:C.text,marginBottom:4}}>Attachments</div>
                <div style={{fontSize:12.5,color:C.t2}}>{d.attachments}</div>
              </div>
            </div>
            <div style={{fontSize:12.5,fontWeight:600,color:C.text,marginBottom:8}}>Data Difference</div>
            <table style={{width:"100%",borderCollapse:"collapse",marginBottom:18}}>
              <thead><tr>
                <th style={{...thS,padding:"6px 0",background:"none"}}>Field</th>
                <th style={{...thS,padding:"6px 0",background:"none"}}>Current Value</th>
                <th style={{...thS,padding:"6px 0",background:"none"}}>Proposed Value</th>
              </tr></thead>
              <tbody>
                {d.diff.map((r,i)=>(
                  <tr key={i}>
                    <td style={{...tdS,padding:"8px 0",border:"none"}}>{r.field}</td>
                    <td style={{...tdS,padding:"8px 0",border:"none",color:C.red}}>{r.current}</td>
                    <td style={{...tdS,padding:"8px 0",border:"none",color:C.greenT}}>{r.proposed}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{fontSize:12.5,fontWeight:600,color:C.text,marginBottom:8}}>Additional Context</div>
            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <thead><tr>
                <th style={{...thS,padding:"6px 0",background:"none"}}>Field</th>
                <th style={{...thS,padding:"6px 0",background:"none"}}>Value</th>
              </tr></thead>
              <tbody>
                {d.context.map((r,i)=>(
                  <tr key={i}>
                    <td style={{...tdS,padding:"8px 0",border:"none"}}>{r.field}</td>
                    <td style={{...tdS,padding:"8px 0",border:"none"}}>{r.value}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </>}
          {tab==="remarks"&&<div style={{fontSize:12.5,color:C.t3,padding:"20px 0",textAlign:"center"}}>No remarks on this request.</div>}
        </div>
        <div style={{padding:"12px 20px",borderTop:`1px solid ${C.border}`,display:"flex",justifyContent:"flex-end",flexShrink:0}}>
          <Btn variant="outline" onClick={onClose}>Close</Btn>
        </div>
      </div>
    </div>
  );
}

function HomepageView(){
  return(
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:6}}>
      <div style={{fontSize:20,color:C.t3}}>Welcome</div>
      <div style={{fontSize:28,fontWeight:700,color:C.text}}>Utkarsh Giri</div>
    </div>
  );
}

function TicketsTable({onOpenRequest}){
  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{padding:"20px 24px 12px",flexShrink:0}}>
        <div style={{fontSize:22,fontWeight:700,color:C.text,marginBottom:4}}>GMC Tickets</div>
        <div style={{display:"flex",alignItems:"center",gap:5,fontSize:12.5,color:C.t3}}>
          <span>GMC</span><span style={{fontSize:11}}>›</span><span style={{color:C.t2,fontWeight:500}}>Tickets</span>
        </div>
      </div>
      <div style={{padding:"0 24px 12px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",border:`1px solid ${C.grayB}`,borderRadius:6,height:34,padding:"0 10px",gap:6}}>
          {ICONS.search}
          <span style={{fontSize:13,color:C.t3}}>Search by request ID or activity name</span>
        </div>
        <Btn variant="outline">Show Filters</Btn>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"0 24px"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr>
            <th style={thS}>Request ID</th><th style={thS}>Activity ID</th><th style={thS}>Activity Name</th>
            <th style={thS}>Status</th><th style={thS}>Maker</th><th style={thS}>Created At</th><th style={thS}>Target ID</th>
          </tr></thead>
          <tbody>
            {MOCK_TICKETS.map(r=>{
              const s=STATUS_STYLE[r.status];
              const hasDetail=!!REQUEST_DETAIL[r.id];
              return(
                <tr key={r.id} onClick={()=>hasDetail&&onOpenRequest(r.id)} style={{cursor:hasDetail?"pointer":"default"}}
                  onMouseEnter={e=>{if(hasDetail)e.currentTarget.style.background=C.bg2}}
                  onMouseLeave={e=>{e.currentTarget.style.background=C.bg}}>
                  <td style={tdS}>{r.id}</td>
                  <td style={{...tdS,color:C.t2}}>{r.activityId}</td>
                  <td style={tdS}>{r.name}</td>
                  <td style={tdS}><span style={{display:"inline-flex",alignItems:"center",padding:"2px 8px",borderRadius:4,fontSize:12,fontWeight:500,background:s.bg,color:s.c,border:`1px solid ${s.b}`}}>{r.status}</span></td>
                  <td style={tdS}>{r.maker}</td>
                  <td style={{...tdS,color:C.t2}}>{r.created}</td>
                  <td style={tdS}>{r.target}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   APP — placement and display mode are
   locked, no comparison dropdowns. Only
   controls left are the ones an agent would
   actually use: open/close and mute.
═══════════════════════════════════════ */
function App(){
  const [panelOpen,setPanelOpen]=useState(true);
  const [collapsed,setCollapsed]=useState(false);
  const [page,setPage]=useState("home");
  const [openRequestId,setOpenRequestId]=useState(null);
  const [muted,setMuted]=useState(false);
  const unreadCount=muted?0:ITEMS.filter(i=>i.status==="unread").length;

  const openRequest=(id)=>{
    setPage("gmc-tickets");
    setOpenRequestId(id);
    setPanelOpen(false);
  };

  return(
    <div style={{height:"100vh",display:"flex",flexDirection:"column",boxSizing:"border-box"}}>
      <div style={{position:"relative",display:"flex",flex:1,minHeight:0,height:"100%",background:C.bg,overflow:"hidden"}}>
        <Sidebar panelOpen={panelOpen} onToggle={()=>setPanelOpen(o=>!o)} unreadCount={unreadCount} collapsed={collapsed} onToggleCollapse={()=>setCollapsed(c=>!c)} page={page} onNavigate={setPage}/>
        <div style={{flex:1,height:"100%",display:"flex",flexDirection:"column",position:"relative",overflow:"hidden"}}>
          {page==="home"&&<HomepageView/>}
          {page==="gmc-tickets"&&<TicketsTable onOpenRequest={setOpenRequestId}/>}
          {panelOpen &&
            <RightPanel
              onOpenRequest={openRequest}
              muted={muted}
              onToggleMute={()=>setMuted(m=>!m)}
            />
          }
        </div>
      </div>

      {openRequestId&&<RequestDetailModal requestId={openRequestId} onClose={()=>setOpenRequestId(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
